<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Management</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            padding-top: 50px;
            padding-bottom: 20px;
        }
        .navbar {
            margin-bottom: 20px;
        }
        .form-container {
            max-width: 500px;
            margin: 0 auto;
        }
        .order-list {
            margin-top: 20px;
            list-style-type: none;
        }
        .order-item {
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .order-item a {
            margin-right: 10px;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-md navbar-dark bg-dark fixed-top">
    <a class="navbar-brand" href="/">Store Management</a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarCollapse" aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
    </button>
</nav>

<div class="container">

<div class="form-container">
    <h2>Create Order</h2>

    <form id="add-order-form">

        <div class="form-group">
            <label>Products</label>
            <div id="order-products">
                <div class="form-row order-product-row mb-2">
                    <div class="col">
                        <select class="form-control product-id" required>
                            <option value="">Select a product</option>
                        </select>
                    </div>
                    <div class="col">
                        <input type="number" class="form-control product-quantity" min="1" placeholder="Quantity" required>
                    </div>
                    <div class="col-auto">
                        <button type="button" class="btn btn-danger remove-product" disabled>Remove</button>
                    </div>
                </div>
            </div>
        </div>

        <button type="button" id="add-product" class="btn btn-secondary">Add product</button>
        <button type="submit" class="btn btn-primary">Create Order</button>

    </form>
    <div id="order-message" class="mt-3"></div>
    <div class="form-group mt-3">
        <label for="order-id">Find order by ID</label>
        <input type="number" class="form-control" id="order-id" min="1">
    </div>
    <button type="button" class="btn btn-info" onclick="getOrderById()">Find Order</button>
</div>

<h2>Orders List</h2>

<table id="order-list" class="table table-striped">

    <thead>
        <tr>
            <th>ID</th>
            <th>User</th>
            <th>Total</th>
            <th>Status</th>
            <th>Created at</th>
            <th>Items</th>
        </tr>
    </thead>

    <tbody></tbody>

</table>

<button type="button" class="btn btn-secondary" onclick="getOrders()">Get Orders</button>

</div>

<script src="/static/scriptOrdenes.js"></script>

</body>
</html>
